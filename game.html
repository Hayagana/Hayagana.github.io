<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 150px); /* 3 columns of 150px each */
            grid-gap: 5px; /* Space between cells */
        }

        #cell {
            width: 150px;
            height: 150px;
            border: 2px solid #ccc; /* Border around each cell */
            text-align: center;
            font-size: 80px;
            cursor: pointer; /* Change cursor on hover */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cell:hover {
            background-color: #f0f0f0; /* Light gray on hover */
        }

        button {
            background-color: #4CAF50; /* Green button */
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block; /* Make button take up space */
            font-size: 16px;
            cursor: pointer; /* Change cursor on hover */
            border-radius: 5px; /* Rounded corners */
        }

        button:hover {
            background-color: #3e8e41; /* Darker green on hover */
        }

    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>

    <div id="game-board">
        <div id="cell1" onclick="handleClick(0)"></div>
        <div id="cell2" onclick="handleClick(1)"></div>
        <div id="cell3" onclick="handleClick(2)"></div>
        <div id="cell4" onclick="handleClick(3)"></div>
        <div id="cell5" onclick="handleClick(4)"></div>
        <div id="cell6" onclick="handleClick(5)"></div>
        <div id="cell7" onclick="handleClick(6)"></div>
        <div id="cell8" onclick="handleClick(7)"></div>
        <div id="cell9" onclick="handleClick(8)"></div>
    </div>

    <button id="reset-game">Reset Game</button>

    <script>
        let board = Array(9).fill(""); // Initialize the board as an empty array
        let playerTurn = 0; // 0 for X, 1 for O

        function handleClick(index) {
            if (board[index] !== "") return; // Prevent clicking on occupied cells

            board[index] = playerTurn ? "X" : "O"; // Place the marker

            // Update UI
            document.getElementById(`cell${index + 1}`).textContent = board[index];

            // Check for win
            if (checkWin()) {
                alert(`Player ${playerTurn ? "X" : "O"} wins!`);
                resetGame();
            } else if (checkTie()) {
                alert("It's a tie!");
                resetGame();
            } else {
                // Switch turns
                playerTurn = 1 - playerTurn; // Toggle between 0 and 1
            }
        }

        function checkWin() {
            // Check rows, columns, and diagonals
            if (board[0] === board[1] && board[1] === board[2] && board[0] !== "") return true;
            if (board[3] === board[4] && board[4] === board[5] && board[3] !== "") return true;
            if (board[6] === board[7] && board[7] === board[8] && board[6] !== "") return true;
            if (board[0] === board[3] && board[3] === board[6] && board[0] !== "") return true;
            if (board[1] === board[4] && board[4] === board[7] && board[1] !== "") return true;
            if (board[2] === board[5] && board[5] === board[8] && board[2] !== "") return true;
            if (board[0] === board[4] && board[4] === board[8] && board[0] !== "") return true;
            if (board[2] === board[4] && board[4] === board[6] && board[2] !== "") return true;
            return false;
        }

        function checkTie() {
            return board.indexOf("") === -1; // Return true if no empty cells remain
        }

        function resetGame() {
            board = Array(9).fill(""); // Reset the board
            playerTurn = 0;

            // Clear cell text
            for (let i = 1; i <= 9; i++) {
                document.getElementById(`cell${i}`).textContent = "";
            }
        }

    </script>

</body>
</html>
