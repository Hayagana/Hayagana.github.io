<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px); /* 3 columns of 100px each */
            grid-gap: 5px; /* Space between cells */
        }

        #cell {
            width: 100px;
            height: 100px;
            border: 2px solid #ccc; /* Border around each cell */
            text-align: center;
            font-size: 40px;
            cursor: pointer; /* Change cursor on hover */
        }

        #cell:hover {
            background-color: #f0f0f0; /* Light gray on hover */
        }

        button {
            background-color: #4CAF50; /* Green button */
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block; /* Make button take up space */
            font-size: 16px;
            cursor: pointer; /* Change cursor on hover */
            border-radius: 5px; /* Rounded corners */
        }

        button:hover {
            background-color: #3e8e41; /* Darker green on hover */
        }

    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>

    <div id="game-board">
        <!-- Add your Tic-Tac-Toe board elements here (cells, buttons) -->
        <div id="cell1"></div>
        <div id="cell2"></div>
        <div id="cell3"></div>
        <div id="cell4"></div>
        <div id="cell5"></div>
        <div id="cell6"></div>
        <div id="cell7"></div>
        <div id="cell8"></div>
        <div id="cell9"></div>
    </div>

    <button id="back-to-hello">Back to Hello World</button>

    <script>
        // JavaScript for Tic-Tac-Toe game logic (add your code here)

        document.addEventListener('DOMContentLoaded', function() {
            const cells = document.querySelectorAll('#cell'); // Get all the cell elements
            const backToHelloButton = document.getElementById('back-to-hello');

            cells.forEach(function(cell) {
                cell.addEventListener('click', function() {
                    // Add your cell click logic here (e.g., update the board)
                    console.log('Cell clicked:', this); // Log which cell was clicked
                });
            });

            if (backToHelloButton) { // Check if the button exists
                backToHelloButton.addEventListener('click', function() {
                    // Redirect back to the Hello World page
                    window.location.href = 'index.html';
                });
            }
        });
    </script>

</body>
</html>
